# ===== Network =====
bind 0.0.0.0
port 6379
protected-mode no  # dev only - prod nên để yes + requirepass

# ===== General =====
daemonize no
loglevel notice
logfile ""
databases 16

# ===== Persistence (RDB snapshots) =====
save 900 1       # Sau 900s nếu có >= 1 key thay đổi
save 300 10      # Sau 300s nếu có >= 10 keys thay đổi
save 60 10000    # Sau 60s nếu có >= 10000 keys thay đổi
dbfilename dump.rdb
dir /data

# ===== Append Only File (AOF) =====
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ===== Memory =====
maxmemory 256mb
maxmemory-policy allkeys-lru  # Khi đầy memory, xóa key ít dùng nhất

# ===== Slow log =====
slowlog-log-slower-than 10000
slowlog-max-len 128